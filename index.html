<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | CSU-Piat Dormitory &amp; Cottage Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/CSU-Logo.png">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="row g-0">
      <div class="col-md-5 brand-panel">
        <img src="img/CSU-Logo.png" alt="CSU-Piat Logo" class="brand-logo-lg mb-3" style="filter: drop-shadow(0 4px 10px rgba(0,0,0,0.25));">
        <h3 class="fw-bold">CSU-Piat</h3>
        <h5>Dormitory &amp; Cottage Finder</h5>
        <p class="mt-3 mb-0 opacity-75">Find, reserve, and manage your stay — dormitories and cottages made simple for CSU-Piat students.</p>
      </div>
      <div class="col-md-7 auth-form-panel">
        <div class="d-flex role-toggle gap-2 mb-4">
          <button type="button" class="btn btn-primary active" id="role-student-btn"><i class="fa-solid fa-user-graduate me-1"></i> Student</button>
          <button type="button" class="btn btn-outline-primary" id="role-admin-btn"><i class="fa-solid fa-user-shield me-1"></i> Administrator</button>
        </div>

        <h4 class="fw-bold mb-1">Welcome back</h4>
        <p class="text-muted mb-4">Log in to continue.</p>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="login-email" required placeholder="you@csupiat.edu.ph">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="login-password" required placeholder="Enter your password">
              <button class="btn btn-outline-secondary" type="button" id="toggle-password"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember-me">
              <label class="form-check-label small" for="remember-me">Remember me</label>
            </div>
            <a href="forgot-password.html" class="small">Forgot Password?</a>
          </div>
          <div class="alert alert-danger d-none" id="login-error"></div>
          <button type="submit" class="btn btn-primary w-100 py-2" id="login-submit-btn">Log In</button>

          <div class="position-relative text-center my-3">
            <hr class="my-0">
            <span class="position-absolute top-50 start-50 translate-middle bg-white px-2 small text-muted">or</span>
          </div>

          <a href="guest.html" class="btn btn-outline-secondary w-100 py-2">
            <i class="fa-solid fa-compass me-1"></i> Browse Available Units as Guest
          </a>
        </form>

        <p class="text-center mt-4 mb-0" id="register-hint">Don't have an account? <a href="register.html">Register here</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    const MAX_ATTEMPTS = 3;
    const LOCKOUT_SECONDS = 30;
    const STORAGE_KEY_ATTEMPTS = "wdacfwrs_login_attempts";
    const STORAGE_KEY_LOCKOUT = "wdacfwrs_lockout_until";

    let currentRole = "student";
    let countdownTimer = null;

    const studentBtn = document.getElementById("role-student-btn");
    const adminBtn = document.getElementById("role-admin-btn");
    const registerHint = document.getElementById("register-hint");
    const submitBtn = document.getElementById("login-submit-btn");
    const emailInput = document.getElementById("login-email");
    const passwordInput = document.getElementById("login-password");
    const errorEl = document.getElementById("login-error");

    function getFailedAttempts() {
      const val = parseInt(localStorage.getItem(STORAGE_KEY_ATTEMPTS) || "0", 10);
      return isNaN(val) ? 0 : val;
    }

    function setFailedAttempts(val) {
      if (val <= 0) {
        localStorage.removeItem(STORAGE_KEY_ATTEMPTS);
      } else {
        localStorage.setItem(STORAGE_KEY_ATTEMPTS, String(val));
      }
    }

    function getLockoutRemainingSec() {
      const until = parseInt(localStorage.getItem(STORAGE_KEY_LOCKOUT) || "0", 10);
      if (!until || isNaN(until)) return 0;
      const remaining = Math.ceil((until - Date.now()) / 1000);
      return remaining > 0 ? remaining : 0;
    }

    function startLockout(seconds = LOCKOUT_SECONDS) {
      if (countdownTimer) clearInterval(countdownTimer);

      const existingUntil = parseInt(localStorage.getItem(STORAGE_KEY_LOCKOUT) || "0", 10);
      if (!existingUntil || existingUntil <= Date.now()) {
        localStorage.setItem(STORAGE_KEY_LOCKOUT, String(Date.now() + (seconds * 1000)));
      }

      function updateUI() {
        const remaining = getLockoutRemainingSec();
        if (remaining > 0) {
          submitBtn.disabled = true;
          emailInput.disabled = true;
          passwordInput.disabled = true;
          submitBtn.innerHTML = `<i class="fa-solid fa-lock me-2"></i>Locked (${remaining}s)`;

          errorEl.className = "alert alert-warning";
          errorEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation me-2"></i>Too many failed attempts. Login is locked. Please try again in <strong><span id="lockout-countdown">${remaining}</span>s</strong>.`;
          errorEl.classList.remove("d-none");
        } else {
          clearInterval(countdownTimer);
          countdownTimer = null;
          localStorage.removeItem(STORAGE_KEY_LOCKOUT);
          setFailedAttempts(0);

          submitBtn.disabled = false;
          emailInput.disabled = false;
          passwordInput.disabled = false;
          submitBtn.innerHTML = `Log In`;

          errorEl.className = "alert alert-info";
          errorEl.innerHTML = `<i class="fa-solid fa-circle-check me-2"></i>Lockout expired. You can now try logging in again.`;
          errorEl.classList.remove("d-none");
        }
      }

      updateUI();
      countdownTimer = setInterval(updateUI, 1000);
    }

    function setRole(role) {
      currentRole = role;
      studentBtn.classList.toggle("btn-primary", role === "student");
      studentBtn.classList.toggle("btn-outline-primary", role !== "student");
      adminBtn.classList.toggle("btn-primary", role === "admin");
      adminBtn.classList.toggle("btn-outline-primary", role !== "admin");
      registerHint.style.display = role === "admin" ? "none" : "";
    }
    studentBtn.addEventListener("click", () => setRole("student"));
    adminBtn.addEventListener("click", () => setRole("admin"));

    wireTogglePassword("toggle-password", "login-password");

    // Redirect if already logged in
    (async function () {
      const session = await Auth.getSession();
      if (session && (session.role === "admin" || session.role === "student")) {
        window.location.href = session.role === "admin" ? "admin/dashboard.html" : "user/dashboard.html";
        return;
      }
      const notice = sessionStorage.getItem("loginNotice");
      if (notice) {
        sessionStorage.removeItem("loginNotice");
        showToast(notice, "success");
      }

      // Check if currently locked out
      const activeLock = getLockoutRemainingSec();
      if (activeLock > 0) {
        startLockout(activeLock);
      }
    })();

    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();

      const activeLock = getLockoutRemainingSec();
      if (activeLock > 0) {
        startLockout(activeLock);
        return;
      }

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      errorEl.classList.add("d-none");

      if (!email || !password) {
        errorEl.className = "alert alert-danger";
        errorEl.textContent = "Please enter your email and password.";
        errorEl.classList.remove("d-none");
        return;
      }

      withLoading(async () => {
        const result = currentRole === "admin" ? await Auth.loginAdmin(email, password) : await Auth.loginStudent(email, password);
        if (!result.ok) {
          const isLockedMsg = result.message && result.message.toLowerCase().includes("locked");
          const nextAttempts = getFailedAttempts() + 1;
          setFailedAttempts(nextAttempts);

          if (nextAttempts >= MAX_ATTEMPTS || isLockedMsg) {
            setFailedAttempts(MAX_ATTEMPTS);
            startLockout(LOCKOUT_SECONDS);
          } else {
            const remainingAttempts = MAX_ATTEMPTS - nextAttempts;
            errorEl.className = "alert alert-danger";
            errorEl.innerHTML = `<i class="fa-solid fa-circle-xmark me-2"></i>${result.message || "Invalid email or password."} <div class="small fw-semibold mt-1 text-danger">Attempt ${nextAttempts} of ${MAX_ATTEMPTS} (${remainingAttempts} attempt${remainingAttempts === 1 ? "" : "s"} remaining before 30-second lockout)</div>`;
            errorEl.classList.remove("d-none");
          }
          return;
        }

        // Login successful: reset counter & lockout
        setFailedAttempts(0);
        localStorage.removeItem(STORAGE_KEY_LOCKOUT);

        showToast("Log in successful! Redirecting...", "success");
        const justRegistered = sessionStorage.getItem("justRegistered");
        sessionStorage.removeItem("justRegistered");
        const isStudent = result.user && result.user.role === "student";
        const needsProfile = isStudent && (justRegistered || (result.profileStatus && !result.profileStatus.parentComplete));

        setTimeout(() => {
          if (result.user && result.user.role === "admin") {
            window.location.href = "admin/dashboard.html";
          } else if (needsProfile) {
            window.location.href = "user/profile.html?required=1";
          } else {
            window.location.href = "user/dashboard.html";
          }
        }, 600);
      });
    });
  </script>
</body>
</html>
