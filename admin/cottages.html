<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1366">
  <title>Manage Cottages | CSU-Piat Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="../img/CSU-Logo.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-role="admin" data-page="cottages">
  <aside class="app-sidebar" id="app-sidebar"></aside>
  <header class="app-topbar" id="app-topbar"></header>

  <main class="app-main">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold mb-0">Manage Cottages</h4>
      <button class="btn btn-primary" id="add-cottage-btn"><i class="fa-solid fa-plus me-1"></i>Add Cottage</button>
    </div>

    <div class="section-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle table-responsive-card">
          <thead>
            <tr>
              <th>Image</th><th>Owner</th><th>Name</th><th>Rooms</th><th>Price</th><th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="cottages-table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add/Edit Modal -->
  <div class="modal fade" id="cottage-modal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="cottage-form">
          <div class="modal-header">
            <h5 class="modal-title" id="cottage-modal-title">Add Cottage</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="cottage-id">
            
            <!-- Cottage Details -->
            <h6 class="fw-bold text-primary mb-3 border-bottom pb-2"><i class="fa-solid fa-house-chimney me-2"></i>Cottage Details</h6>
            <div class="row g-3 mb-4">
              <div class="col-md-6"><label class="form-label small fw-semibold">Cottage Name</label><input class="form-control" id="cottage-name" required placeholder="e.g. Pine Breeze Cottage"></div>
              <div class="col-md-3"><label class="form-label small fw-semibold">Number of Rooms</label><input type="number" min="1" class="form-control" id="cottage-rooms" required placeholder="1"></div>
              <div class="col-md-3"><label class="form-label small fw-semibold">Price (₱ / day)</label><input type="number" min="0" step="0.01" class="form-control" id="cottage-price" required placeholder="500.00"></div>
              <div class="col-12"><label class="form-label small fw-semibold">Description &amp; Amenities</label><textarea class="form-control" id="cottage-description" rows="2" required placeholder="Describe cottage features, beds, kitchen amenities..."></textarea></div>
                            <div class="col-12">
                <label class="form-label small fw-semibold"><i class="fa-solid fa-images me-1 text-primary"></i>Cottage Facility Photos (5 Pictures)</label>
                <div class="row g-2">
                  <div class="col-md-4 col-6">
                    <label class="form-label small text-muted mb-1">Photo 1 (Cover / Main)</label>
                    <input type="file" accept="image/*" class="form-control form-control-sm" id="cottage-image-input">
                    <img id="cottage-image-preview" class="mt-1 rounded border w-100" style="height:90px;object-fit:cover;display:none;">
                  </div>
                  <div class="col-md-4 col-6">
                    <label class="form-label small text-muted mb-1">Photo 2</label>
                    <input type="file" accept="image/*" class="form-control form-control-sm" id="cottage-image-1">
                    <img id="cottage-image-preview-1" class="mt-1 rounded border w-100" style="height:90px;object-fit:cover;display:none;">
                  </div>
                  <div class="col-md-4 col-6">
                    <label class="form-label small text-muted mb-1">Photo 3</label>
                    <input type="file" accept="image/*" class="form-control form-control-sm" id="cottage-image-2">
                    <img id="cottage-image-preview-2" class="mt-1 rounded border w-100" style="height:90px;object-fit:cover;display:none;">
                  </div>
                  <div class="col-md-4 col-6">
                    <label class="form-label small text-muted mb-1">Photo 4</label>
                    <input type="file" accept="image/*" class="form-control form-control-sm" id="cottage-image-3">
                    <img id="cottage-image-preview-3" class="mt-1 rounded border w-100" style="height:90px;object-fit:cover;display:none;">
                  </div>
                  <div class="col-md-4 col-6">
                    <label class="form-label small text-muted mb-1">Photo 5</label>
                    <input type="file" accept="image/*" class="form-control form-control-sm" id="cottage-image-4">
                    <img id="cottage-image-preview-4" class="mt-1 rounded border w-100" style="height:90px;object-fit:cover;display:none;">
                  </div>
                </div>
              </div>
            </div>

            
              <!-- Unit Location Pinning Section -->
              <div class="col-12 mt-3">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-2">
                  <h6 class="fw-bold text-primary mb-0"><i class="fa-solid fa-map-location-dot me-2"></i>Unit Map Pin Location (Google Maps)</h6>
                  <div>
                    <span class="badge bg-light text-dark border small pin-coords-badge"><i class="fa-solid fa-location-dot text-danger me-1"></i>Pin: 17.792503, 121.510505</span>
                    <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2 ms-1 reset-pin-btn" title="Reset Pin to CSU-Piat Campus Center"><i class="fa-solid fa-rotate-left me-1"></i>Reset to CSU-Piat</button>
                  </div>
                </div>
                <div class="row g-2 mb-2">
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold">Location / Landmark Description</label>
                    <input class="form-control form-control-sm" id="cottage-map-address" placeholder="e.g. Near CSU-Piat Agriculture Quad / Baung, Piat">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label small fw-semibold">Latitude</label>
                    <input type="number" step="any" class="form-control form-control-sm" id="cottage-latitude" value="17.792503" required>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label small fw-semibold">Longitude</label>
                    <input type="number" step="any" class="form-control form-control-sm" id="cottage-longitude" value="121.510505" required>
                  </div>
                </div>
                <div class="border rounded-3 overflow-hidden shadow-sm position-relative" style="height:210px;" id="cottage-map-picker"></div>
                <div class="d-flex justify-content-between align-items-center mt-1">
                  <span class="small text-muted"><i class="fa-solid fa-hand-pointer text-primary me-1"></i>Click anywhere on the map or drag the pin to set unit location.</span>
                  <a href="https://www.google.com/maps?q=17.792503,121.510505" target="_blank" rel="noopener noreferrer" class="small text-primary text-decoration-none" id="cottage-map-preview-link">
                    <i class="fa-solid fa-arrow-up-right-from-square me-1"></i>Preview in Google Maps
                  </a>
                </div>
              </div>

            <!-- Owner Profile Section -->
            <h6 class="fw-bold text-primary mb-3 border-bottom pb-2"><i class="fa-solid fa-id-badge me-2"></i>Owner Profile, Contact &amp; Online Payment (QR Code)</h6>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Owner / Host Name</label>
                <input class="form-control" id="cottage-owner" required placeholder="e.g. Maria Fernandez">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Owner Contact Phone</label>
                <input type="tel" class="form-control" id="cottage-owner-phone" placeholder="09XXXXXXXXX" pattern="09[0-9]{9}" maxlength="11" minlength="11" inputmode="numeric" title="Enter an 11-digit PH mobile number starting with 09 (e.g. 09123456789)">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Owner Email Address</label>
                <input type="email" class="form-control" id="cottage-owner-email" placeholder="owner@gmail.com">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Owner Profile Picture</label>
                <input type="file" accept="image/*" class="form-control" id="cottage-owner-photo-input">
                <img id="cottage-owner-photo-preview" class="mt-2 rounded-circle border" style="width:60px;height:60px;object-fit:cover;display:none;">
              </div>
              <div class="col-12">
                <label class="form-label small fw-semibold">Owner Bio / Host Description</label>
                <textarea class="form-control" id="cottage-owner-bio" rows="2" placeholder="Brief host background, availability hours, resident caretaker info..."></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Account / Payee Name</label>
                <input class="form-control" id="cottage-account-name" placeholder="e.g. Maria Fernandez (GCash/Maya)">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Account / Mobile Number</label>
                <input class="form-control" id="cottage-account-number" placeholder="e.g. 0917-123-4567">
              </div>
              <div class="col-12">
                <label class="form-label small fw-semibold">Owner Payment QR Code (GCash / Maya / Bank)</label>
                <input type="file" accept="image/*" class="form-control" id="cottage-qr-input">
                <div class="mt-2" id="cottage-qr-preview-container" style="display:none;">
                  <img id="cottage-qr-preview" class="border rounded p-1" style="max-height:160px;object-fit:contain;background:#fff;">
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Cottage</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- View Modal -->
  <div class="modal fade" id="cottage-view-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Cottage Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="cottage-view-body"></div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../assets/js/map-picker.js"></script>
  <script src="../assets/js/admin-cottages.js"></script>
</body>
</html>
