<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1366">
  <title>Manage Dormitories | CSU-Piat Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="../img/CSU-Logo.png">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-role="admin" data-page="dormitories">
  <aside class="app-sidebar" id="app-sidebar"></aside>
  <header class="app-topbar" id="app-topbar"></header>

  <main class="app-main">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold mb-0">Manage Dormitories</h4>
      <button class="btn btn-primary" id="add-dorm-btn"><i class="fa-solid fa-plus me-1"></i>Add Dormitory</button>
    </div>

    <div class="section-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle table-responsive-card">
          <thead>
            <tr>
              <th>Image</th><th>Dormitory Name</th><th>Accepted Boarders</th><th>Capacity</th><th>Price</th><th>Status</th><th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="dorms-table-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add/Edit Modal -->
  <div class="modal fade" id="dorm-modal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="dorm-form">
          <div class="modal-header">
            <h5 class="modal-title" id="dorm-modal-title">Add Dormitory</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="dorm-id">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Dormitory Name</label><input class="form-control" id="dorm-room-number" placeholder="e.g., Sampaguita Hall" required></div>
              <div class="col-md-6"><label class="form-label">Accepted Boarders</label>
                <select class="form-select" id="dorm-gender" required>
                  <option value="Male">Male Boarders Only</option>
                  <option value="Female">Female Boarders Only</option>
                  <option value="Mixed">Mixed Gender (Male &amp; Female)</option>
                </select>
              </div>
              <div class="col-md-4"><label class="form-label">Capacity</label><input type="number" min="1" class="form-control" id="dorm-capacity" required></div>
              <div class="col-md-4"><label class="form-label">Price (monthly)</label><input type="number" min="0" class="form-control" id="dorm-price" required></div>
              <div class="col-md-4"><label class="form-label">Status</label>
                <select class="form-select" id="dorm-status" required><option>Available</option><option>Occupied</option><option>Full</option></select>
              </div>
              <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" id="dorm-description" rows="3" required></textarea></div>
              <div class="col-12">
                <label class="form-label">Dormitory Image</label>
                <input type="file" accept="image/*" class="form-control" id="dorm-image-input">
                <img id="dorm-image-preview" class="mt-2 rounded" style="max-height:140px;display:none;">
              </div>

              <!-- Owner Profile & Online Payment QR Section -->
              <div class="col-12 mt-3">
                <h6 class="fw-bold text-primary mb-2 border-bottom pb-2"><i class="fa-solid fa-qrcode me-2"></i>Owner / Landlord &amp; Online Payment (QR Code)</h6>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Owner / Landlord Name</label>
                <input class="form-control" id="dorm-owner-name" placeholder="e.g. Engr. Roberto Santos">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Owner Contact Phone</label>
                <input type="tel" class="form-control" id="dorm-owner-phone" placeholder="09XXXXXXXXX" maxlength="11">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Account / Payee Name</label>
                <input class="form-control" id="dorm-account-name" placeholder="e.g. Roberto Santos (GCash/Maya)">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Account / Mobile Number</label>
                <input class="form-control" id="dorm-account-number" placeholder="e.g. 0912-345-6789">
              </div>
              <div class="col-12">
                <label class="form-label small fw-semibold">Payment QR Code (GCash / Maya / Bank)</label>
                <input type="file" accept="image/*" class="form-control" id="dorm-qr-input">
                <div class="mt-2" id="dorm-qr-preview-container" style="display:none;">
                  <img id="dorm-qr-preview" class="border rounded p-1" style="max-height:160px;object-fit:contain;background:#fff;">
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Dormitory</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- View Modal -->
  <div class="modal fade" id="dorm-view-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Dormitory Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="dorm-view-body"></div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/admin-dormitories.js"></script>
</body>
</html>
