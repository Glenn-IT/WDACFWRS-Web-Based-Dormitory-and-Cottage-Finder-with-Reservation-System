<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile | CSU-Piat DCF</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="../img/CSU-Logo.png">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-role="student" data-page="profile">
  <aside class="app-sidebar" id="app-sidebar"></aside>
  <header class="app-topbar" id="app-topbar"></header>

  <main class="app-main">
    <h4 class="fw-bold mb-4">My Profile</h4>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="section-card text-center">
          <img src="https://placehold.co/160x160" class="rounded-circle mb-3" id="profile-picture" style="width:140px;height:140px;object-fit:cover;">
          <div>
            <label class="btn btn-outline-primary btn-sm">
              <i class="fa-solid fa-camera me-1"></i>Upload Photo
              <input type="file" accept="image/*" id="profile-picture-input" hidden>
            </label>
          </div>
          <h5 class="fw-bold mt-3 mb-0" id="profile-full-name">Student Name</h5>
          <p class="text-muted mb-0" id="profile-email">email@csupiat.edu.ph</p>
          <p class="text-muted small" id="profile-id">STU-0000</p>
          <hr>
          <button class="btn btn-primary w-100 mb-2" data-bs-toggle="modal" data-bs-target="#change-password-modal"><i class="fa-solid fa-lock me-1"></i>Change Password</button>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="section-card">
          <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <ul class="nav nav-tabs border-bottom-0" id="profile-tabs">
              <li class="nav-item"><button class="nav-link active" data-tab="personal" type="button"><i class="fa-solid fa-user me-1"></i>Personal Info</button></li>
              <li class="nav-item"><button class="nav-link" data-tab="parent" type="button"><i class="fa-solid fa-users me-1"></i>Parent / Guardian</button></li>
              <li class="nav-item"><button class="nav-link" data-tab="background" type="button"><i class="fa-solid fa-clipboard-list me-1"></i>Background</button></li>
            </ul>
            <button type="button" class="btn btn-sm btn-outline-primary" id="edit-profile-btn"><i class="fa-solid fa-pen me-1"></i>Edit Profile</button>
          </div>

          <form id="profile-form">
            <fieldset id="profile-fieldset" disabled>
              <!-- Personal Tab -->
              <div id="tab-pane-personal">
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label small">First Name <span class="text-muted">(Read-only)</span></label><input class="form-control bg-light" id="pf-first-name" readonly></div>
                  <div class="col-md-6"><label class="form-label small">Last Name <span class="text-muted">(Read-only)</span></label><input class="form-control bg-light" id="pf-last-name" readonly></div>
                  <div class="col-md-6"><label class="form-label small">Course</label><input class="form-control" id="pf-course"></div>
                  <div class="col-md-3"><label class="form-label small">Year Level</label><input class="form-control" id="pf-year-level"></div>
                  <div class="col-md-3"><label class="form-label small">Semester</label><input class="form-control" id="pf-semester"></div>
                  <div class="col-md-6"><label class="form-label small">Nationality</label><input class="form-control" id="pf-nationality"></div>
                  <div class="col-md-6"><label class="form-label small">Birthday</label><input type="date" class="form-control" id="pf-birthday"></div>
                  <div class="col-md-6"><label class="form-label small">Phone Number</label><input class="form-control" id="pf-phone" placeholder="09XXXXXXXXX" pattern="^(09\d{9}|\+639\d{9})$" maxlength="13" inputmode="tel" title="Enter a valid PH mobile number (e.g. 09123456789)"></div>
                  <div class="col-md-12"><label class="form-label small">Address</label><input class="form-control" id="pf-address"></div>
                </div>
              </div>

              <!-- Parent Info Tab -->
              <div id="tab-pane-parent" class="d-none">
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label small">Father's Full Name</label><input type="text" class="form-control" id="p-father-name"></div>
                  <div class="col-md-6"><label class="form-label small">Mother's Full Name</label><input type="text" class="form-control" id="p-mother-name"></div>
                  <div class="col-md-6"><label class="form-label small">Occupation</label><input type="text" class="form-control" id="p-occupation"></div>
                  <div class="col-md-6"><label class="form-label small">Educational Attainment</label><input type="text" class="form-control" id="p-education"></div>
                  <div class="col-12"><label class="form-label small">Permanent Address</label><input type="text" class="form-control" id="p-address"></div>
                  <div class="col-md-6"><label class="form-label small">Parent's Phone Number</label><input type="text" class="form-control" id="p-phone" placeholder="09XXXXXXXXX" pattern="^(09\d{9}|\+639\d{9})$" maxlength="13" inputmode="tel"></div>
                  <div class="col-md-6"><label class="form-label small">Emergency Contact Person</label><input type="text" class="form-control" id="p-emergency-contact"></div>
                  <div class="col-md-6"><label class="form-label small">Relationship</label><input type="text" class="form-control" id="p-relationship"></div>
                  <div class="col-md-6"><label class="form-label small">Emergency Contact Number</label><input type="text" class="form-control" id="p-emergency-number" placeholder="09XXXXXXXXX" pattern="^(09\d{9}|\+639\d{9})$" maxlength="13" inputmode="tel"></div>
                </div>
              </div>

              <!-- Student Background Tab -->
              <div id="tab-pane-background" class="d-none">
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label small">Appliances Brought</label><input type="text" class="form-control" id="b-appliances"></div>
                  <div class="col-md-6"><label class="form-label small">Friends Staying at Dorm</label>
                    <select class="form-select" id="b-friends"><option value="No">No</option><option value="Yes">Yes</option></select>
                  </div>
                  <div class="col-md-6"><label class="form-label small">Relationship (if any)</label><input type="text" class="form-control" id="b-friends-relationship"></div>
                  <div class="col-md-6"><label class="form-label small">Reason for Staying</label><input type="text" class="form-control" id="b-reason"></div>
                  <div class="col-md-6"><label class="form-label small">Medical Conditions / Allergies</label><input type="text" class="form-control" id="b-medical" value="None"></div>
                  <div class="col-md-6"><label class="form-label small">Severe Illness</label><input type="text" class="form-control" id="b-illness" value="None"></div>
                  <div class="col-md-6"><label class="form-label small">Hobbies</label><input type="text" class="form-control" id="b-hobbies"></div>
                  <div class="col-md-3"><label class="form-label small">Smoking</label>
                    <select class="form-select" id="b-smoking"><option value="No">No</option><option value="Yes">Yes</option></select>
                  </div>
                  <div class="col-md-3"><label class="form-label small">Drinking</label>
                    <select class="form-select" id="b-drinking"><option value="No">No</option><option value="Occasionally">Occasionally</option><option value="Yes">Yes</option></select>
                  </div>
                  <div class="col-md-6"><label class="form-label small">Organizations Joined</label><input type="text" class="form-control" id="b-organizations"></div>
                  <div class="col-md-6"><label class="form-label small">Leisure Activities</label><input type="text" class="form-control" id="b-leisure"></div>
                </div>
              </div>
            </fieldset>

            <div class="mt-4 d-none" id="profile-save-actions">
              <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-1"></i>Save Changes</button>
              <button type="button" class="btn btn-outline-secondary ms-1" id="cancel-edit-btn">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Change Password Modal -->
  <div class="modal fade" id="change-password-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="change-password-form">
          <div class="modal-header">
            <h5 class="modal-title">Change Password</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Current Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="cp-current" required>
                <button class="btn btn-outline-secondary" type="button" id="cp-toggle-current" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">New Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="cp-new" required minlength="6" placeholder="At least 6 alphanumeric chars">
                <button class="btn btn-outline-secondary" type="button" id="cp-toggle-new" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
              </div>
              <div class="form-text text-muted small">Must be at least 6 characters with both letters and numbers.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm New Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="cp-confirm" required minlength="6">
                <button class="btn btn-outline-secondary" type="button" id="cp-toggle-confirm" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
              </div>
            </div>
            <div class="alert alert-danger d-none" id="cp-error"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Update Password</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/user-profile.js"></script>
</body>
</html>
